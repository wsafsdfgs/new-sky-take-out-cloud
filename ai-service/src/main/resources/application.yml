spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: ai-customer-service
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true
    nacos:
      discovery:
        server-addr: localhost:8848
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
          temperature: 0.4
          max-tokens: 500
      embedding:
        options:
          model: text-embedding-v3
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
sky:
  jwt:
    user-secret-key: itheima-itheima-itheima-itheima-itheima
    user-ttl: 7200000
    user-token-name: authentication
  shop:
    phone: "400-800-12345"
    address: "江西省南昌市青山湖区高新大道88号"



