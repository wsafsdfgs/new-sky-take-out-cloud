<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外卖智能客服</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F8EFF'/%3E%3Cpath d='M18 40c1.5-6 7-8.5 12-8.5s10.5 2.5 12 8.5z' fill='white'/%3E%3Ccircle cx='30' cy='25' r='6' fill='white'/%3E%3C/svg%3E">
    <style>
        :root {
            --blue: #2f8eff;
            --blue-dark: #1f6fd0;
            --blue-light: #e8f3ff;
            --blue-border: #cfe5ff;
            --text-main: #333;
            --text-sub: #666;
            --bg-page: #f5f6f7;
            --bg-chat: #f5f6f7;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-page);
            height: 100%;
            overflow: hidden;
            color: var(--text-main);
        }
        .app {
            max-width: 480px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-page);
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            position: relative;
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            background: linear-gradient(135deg, #2f8eff 0%, #56b4ff 100%);
            color: #fff;
            padding: 14px 16px 16px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(47,142,255,0.25);
            position: relative;
            z-index: 5;
        }
        .header .title-row {
            display: flex;
            align-items: center;
        }
        .header .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header .online-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #fff;
            margin-left: 7px;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
        .header .subtitle {
            font-size: 12px;
            opacity: .92;
            margin-top: 3px;
        }
        .biz-login {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .biz-login input {
            flex: 1;
            min-width: 70px;
            padding: 6px 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .biz-login button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: var(--blue);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .biz-login button:active { transform: scale(.95); }
        .biz-login .biz-status {
            font-size: 12px;
            opacity: .9;
        }

        /* ===== 快捷标签 ===== */
        .quick-bar {
            padding: 10px 14px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
            background: #fff;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
        }
        .quick-bar::-webkit-scrollbar { display: none; }
        .quick-bar .tag {
            flex-shrink: 0;
            padding: 9px 15px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid var(--blue-border);
            color: var(--blue-dark);
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: transform .08s, background .12s;
        }
        .quick-bar .tag:active {
            transform: scale(.95);
            background: var(--blue-light);
        }

        /* ===== 聊天区 ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            background: var(--bg-chat);
            -webkit-overflow-scrolling: touch;
        }
        /* 消息行：头像 + 气泡 */
        .row {
            display: flex;
            margin-bottom: 16px;
            align-items: flex-start;
            gap: 10px;
        }
        .row.user { justify-content: flex-end; }
        .row.ai   { justify-content: flex-start; }

        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            overflow: hidden;
        }
        .avatar svg { width: 100%; height: 100%; }
        .row.user .avatar { background: var(--blue-light); order: 2; }
        .row.ai   .avatar { background: #fff; order: 0; border: 1px solid #eee; }

        .bubble-wrap { max-width: 75%; display: flex; flex-direction: column; }
        .row.user .bubble-wrap { order: 1; align-items: flex-end; }
        .row.ai   .bubble-wrap { order: 1; align-items: flex-start; }

        .bubble {
            padding: 10px 13px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.65;
            word-break: break-word;
            white-space: pre-wrap;
            position: relative;
            max-width: 100%;
        }
        /* 用户气泡：蓝底白字 + 右上三角 */
        .row.user .bubble {
            background: linear-gradient(135deg, #2f8eff, #3d9bff);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .row.user .bubble::after {
            content: '';
            position: absolute;
            top: 0; right: -6px;
            border: 6px solid transparent;
            border-top-color: #3d9bff;
            border-right-color: #3d9bff;
            border-bottom-width: 0;
            border-left-width: 0;
        }
        /* AI 气泡：白底深灰字 + 左上三角 */
        .row.ai .bubble {
            background: #fff;
            color: var(--text-sub);
            border: 1px solid #eef0f2;
            border-bottom-left-radius: 4px;
        }
        .row.ai .bubble::after {
            content: '';
            position: absolute;
            top: 0; left: -6px;
            border: 6px solid transparent;
            border-top-color: #fff;
            border-left-color: #fff;
            border-bottom-width: 0;
            border-right-width: 0;
        }
        /* 段落间距保留（AI 回复多段） */
        .row.ai .bubble .ai-content { display: block; }

        .msg-time {
            font-size: 11px;
            color: #b0b4ba;
            margin-top: 4px;
            padding: 0 2px;
        }

        /* 系统提示 */
        .msg-system {
            text-align: center;
            margin: 8px auto 14px;
            width: fit-content;
            padding: 5px 14px;
            background: #e8f3ff;
            color: #1f6fd0;
            font-size: 12px;
            border-radius: 8px;
        }

        /* ===== 正在输入 ===== */
        .typing {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
            padding: 4px 2px;
        }
        .typing .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #c0d9ff;
            animation: blink 1.2s infinite;
        }
        .typing .dot:nth-child(2){ animation-delay:.2s }
        .typing .dot:nth-child(3){ animation-delay:.4s }
        @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

        /* ===== 输入区 ===== */
        .input-bar {
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 12px 12px;
            background: #fff;
            border-top: 1px solid #eee;
            box-shadow: 0 -2px 8px rgba(0,0,0,.05);
        }
        .input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-chat);
            border: 1px solid #e5e7eb;
            border-radius: 22px;
            padding: 8px 16px;
        }
        .input-wrap:focus-within {
            border-color: var(--blue);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(47,142,255,.12);
        }
        .input-wrap textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-main);
            resize: none;
            line-height: 1.5;
            max-height: 90px;
            min-height: 22px;
        }
        .btn-send {
            flex-shrink: 0;
            width: 42px; height: 42px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #2f8eff, #56b4ff);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(47,142,255,.35);
            transition: transform .08s, opacity .15s;
        }
        .btn-send:active { transform: scale(.92); }
        .btn-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn-send svg { width: 20px; height: 20px; }
    </style>
</head>
<body>
<div class="app">
    <!-- 顶部标题栏 -->
    <div class="header">
        <div class="title-row">
            <span class="title" id="titleText">外卖智能客服</span>
            <span class="online-dot"></span>
        </div>
        <div class="subtitle" id="subtitleText">查订单 · 问售后 · 随叫随到</div>
        <!-- 商家端登录区（默认隐藏，mode=business 时显示） -->
        <div id="bizLoginArea" class="biz-login" style="display:none">
            <input id="bizUser" type="text" placeholder="账号" />
            <input id="bizPass" type="password" placeholder="密码" />
            <button onclick="doBizLogin()">登录</button>
            <span id="bizStatus">未登录</span>
        </div>
    </div>

    <!-- 快捷标签：用户端 -->
    <div class="quick-bar" id="quickUser">
        <span class="tag" onclick="quickAsk('帮我查一下我的订单')">查我的订单</span>
        <span class="tag" onclick="quickAsk('怎么申请退款')">怎么退款</span>
        <span class="tag" onclick="quickAsk('我的外卖多久能送到')">催单/送达</span>
        <span class="tag" onclick="quickAsk('你们店电话是多少')">门店电话</span>
    </div>
    <!-- 快捷标签：商家端 -->
    <div class="quick-bar" id="quickBiz" style="display:none">
        <span class="tag" onclick="quickAsk('今天营业额多少')">今日营业</span>
        <span class="tag" onclick="quickAsk('现在有多少待接单订单')">订单概况</span>
        <span class="tag" onclick="quickAsk('最近卖得最好的菜有哪些')">销量Top10</span>
        <span class="tag" onclick="quickAsk('今天营业吗')">营业状态</span>
    </div>

    <!-- 聊天区 -->
    <div class="chat-area" id="chatArea"></div>

    <!-- 输入区 -->
    <div class="input-bar">
        <div class="input-wrap">
            <textarea id="input" rows="1" placeholder="输入问题，如：帮我查订单、怎么申请退款…"
                onkeydown="onInputKey(event)"></textarea>
        </div>
        <button class="btn-send" id="btnSend" onclick="sendChat()" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M3.4 20.4 21.5 12 3.4 3.6l.01 6.4L15 12 3.4 14z" fill="#fff"/>
            </svg>
        </button>
    </div>
</div>

<script>
    // ===== 模式：用户端(user) / 商家端(business) =====
    const isBiz = new URLSearchParams(window.location.search).get('mode') === 'business';
    const sessionId = isBiz ? 'bizMain' : 'mainSession';
    let sending = false;

    // ===== Token 处理 =====
    function getToken() {
        const urlToken = new URLSearchParams(window.location.search).get('token');
        // 用户端：URL ?token= 或 localStorage
        if (!isBiz && urlToken) {
            localStorage.setItem('ai_token', urlToken);
            return urlToken;
        }
        // 商家端：URL ?token=（后台跳转带 admin token）或 localStorage
        if (isBiz && urlToken) {
            localStorage.setItem('ai_biz_token', urlToken);
            return urlToken;
        }
        if (isBiz) return localStorage.getItem('ai_biz_token') || '';
        return localStorage.getItem('ai_token') || '';
    }

    // ===== 商家端登录 =====
    function doBizLogin() {
        const username = document.getElementById('bizUser').value.trim();
        const password = document.getElementById('bizPass').value.trim();
        if (!username || !password) { alert('请输入商家账号和密码'); return; }
        fetch('/ai/businessLogin?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password))
            .then(r => r.json())
            .then(res => {
                if (!res || res.code !== 1 || !res.data || !res.data.token) {
                    document.getElementById('bizStatus').textContent = '登录失败';
                    return;
                }
                localStorage.setItem('ai_biz_token', res.data.token);
                document.getElementById('bizStatus').textContent = '✓ 已登录';
                appendMsg('system', '✅ 商家登录成功，开始查询经营数据吧');
            })
            .catch(() => document.getElementById('bizStatus').textContent = '登录失败');
    }

    // ===== 模式初始化：切换标题/标签/登录区 =====
    function initMode() {
        if (!isBiz) return;
        document.getElementById('titleText').textContent = '店铺经营助手';
        document.getElementById('subtitleText').textContent = '查营业额 · 看订单 · 销量排行';
        document.getElementById('quickUser').style.display = 'none';
        document.getElementById('quickBiz').style.display = 'flex';
        document.getElementById('bizLoginArea').style.display = 'flex';
        // 有缓存商家 token 则显示已登录
        if (getToken()) document.getElementById('bizStatus').textContent = '✓ 已登录';
    }

    function quickAsk(text) {
        const input = document.getElementById('input');
        input.value = text;
        autoResize(input);
        sendChat();
    }

    // 输入框高度自适应
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 90) + 'px';
    }

    function onInputKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChat();
        } else {
            autoResize(e.target);
        }
    }

    function sendChat() {
        if (sending) return;
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;

        const area = document.getElementById('chatArea');
        const btn  = document.getElementById('btnSend');

        // 用户消息
        appendMsg('user', msg);
        input.value = '';
        autoResize(input);
        smoothScroll();

        // 用户端走 generateStream，商家端走 businessStream
        const endpoint = isBiz ? '/ai/businessStream' : '/ai/generateStream';
        const token = getToken();
        if (isBiz && !token) {
            appendMsg('system', '⚠️ 请先完成商家登录');
            sending = false;
            return;
        }
        const url = endpoint
            + '?message=' + encodeURIComponent(msg)
            + '&sessionId=' + sessionId
            + '&token=' + encodeURIComponent(token);

        sending = true;
        btn.disabled = true;

        // 创建 AI 气泡，先显示"正在输入..."
        const aiContent = appendMsg('ai', '');
        const typing = document.createElement('span');
        typing.className = 'typing';
        typing.innerHTML = '正在输入<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        aiContent.parentElement.appendChild(typing);

        const source = new EventSource(url);
        source.onmessage = function (event) {
            if (typing.parentElement) typing.parentElement.removeChild(typing);
            aiContent.textContent += event.data;
            smoothScroll();
        };
        source.onerror = function () {
            source.close();
            if (typing.parentElement) typing.parentElement.removeChild(typing);
            sending = false;
            btn.disabled = false;
            smoothScroll();
        };
    }

    // 平滑滚动到底部
    function smoothScroll() {
        const area = document.getElementById('chatArea');
        area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' });
    }

    // ===== 头像（内联 SVG，轻量） =====
    const USER_AVATAR = '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="18" fill="#d6e9ff"/><circle cx="18" cy="14.5" r="6" fill="#2f8eff"/><path d="M6 30c1.5-6 7-8.5 12-8.5S28.5 24 30 30z" fill="#2f8eff"/></svg>';
    const AI_AVATAR  = '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="18" fill="#eef1f4"/><rect x="10" y="11" width="16" height="12" rx="3" fill="#9bb2c8"/><circle cx="15.2" cy="17" r="1.6" fill="#fff"/><circle cx="20.8" cy="17" r="1.6" fill="#fff"/><rect x="17" y="22" width="2" height="3" fill="#7a90a6"/><rect x="12" y="25" width="12" height="2" rx="1" fill="#9bb2c8"/></svg>';

    // ===== 消息行：头像 + 气泡 =====
    function appendMsg(role, text) {
        const area = document.getElementById('chatArea');
        // 系统提示：居中无头像
        if (role === 'system') {
            const s = document.createElement('div');
            s.className = 'msg-system';
            s.textContent = text;
            area.appendChild(s);
            area.scrollTop = area.scrollHeight;
            return s;
        }
        const row = document.createElement('div');
        row.className = 'row ' + role;

        // 头像
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = role === 'user' ? USER_AVATAR : AI_AVATAR;

        // 气泡
        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'ai') {
            // AI 消息：用 content span 承接流式拼接（white-space:pre-wrap 保留换行/段落）
            const content = document.createElement('span');
            content.className = 'ai-content';
            content.textContent = text;
            bubble.appendChild(content);
        } else {
            bubble.textContent = text;
        }
        wrap.appendChild(bubble);

        // 时间
        const time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        wrap.appendChild(time);

        row.appendChild(avatar);
        row.appendChild(wrap);
        area.appendChild(row);
        // AI 返回 content span（供流式拼接），其余返回整行
        return role === 'ai' ? wrap.querySelector('.ai-content') : row;
    }

    // 页面加载：根据 mode 初始化
    window.onload = initMode;
</script>
</body>
</html>
